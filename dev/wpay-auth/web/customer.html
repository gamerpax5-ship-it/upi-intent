<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPay payment</title><link rel="stylesheet" href="/wpay-auth/styles.css"><script src="/wpay-auth/customer.js" defer></script></head><body><header><span class="brand">WPay</span></header><main><section class="card"><h1>Payment</h1><p id="notice"></p><dl id="facts" class="facts"></dl><div id="payment"></div><form id="claim"><label>12-digit UTR<input name="utr" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" required autocomplete="off"></label><button type="submit">Submit payment claim</button></form><p>A UTR submission is a claim only. Payment succeeds after independent verification and accounting.</p><p id="status" role="status"></p></section></main></body></html>
