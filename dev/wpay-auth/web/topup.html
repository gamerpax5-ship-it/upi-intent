<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WPay top-up</title><link rel="stylesheet" href="/wpay-auth/styles.css"><script src="/wpay-auth/topup.js" defer></script></head><body><header><span class="brand">WPay</span></header><main><section class="card"><h1>Top up / Pay</h1><p id="notice">Enter the amount you want to pay.</p><dl id="facts" class="facts"></dl><form id="topup"><label>Customer / wallet reference<input name="customerReference" maxlength="200" required autocomplete="off" placeholder="Your account or wallet ID"></label><label>Amount (INR)<input name="amount" inputmode="decimal" required autocomplete="off" placeholder="500.00"></label><button type="submit">Continue to payment</button></form><p>Each payment creates a new order. After paying, submitting the 12-digit UTR is mandatory before WPay can verify the payment.</p><p id="status" role="status"></p></section></main></body></html>
