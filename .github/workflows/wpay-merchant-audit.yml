name: Merchant panel audit
on:
  pull_request:
    paths:
      - 'dev/wpay-auth/web/merchant-premium.*'
      - 'scripts/test-merchant-audit-ui.js'
      - '.github/workflows/wpay-merchant-audit.yml'
permissions:
  contents: read
jobs:
  merchant-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-merchant-audit
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm ci --prefix lib/wpay/auth/runtime/dependencies --registry=https://registry.npmjs.org
      - name: Protected legacy check
        run: node scripts/check-protected-legacy.js
      - name: Syntax and isolated financial regressions
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-merchant-audit@127.0.0.1:5432/postgres
        run: |
          npm run check
          node --test test/wpay-payout.test.js test/wpay-payout-approval.test.js test/wpay-payout-disputes.test.js test/wpay-payout-rate-history.test.js test/wpay-merchant-premium.test.js
      - name: Merchant pages and regression checks
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/merchant-audit" linkedom@0.18.13 --ignore-scripts --package-lock=false --registry=https://registry.npmjs.org
          export WPAY_TEST_DOM_MODULE="$RUNNER_TEMP/merchant-audit/node_modules/linkedom"
          node scripts/test-merchant-ui.js
          node scripts/test-merchant-payout-ui.js
          node scripts/test-merchant-dispute-ui.js
          node scripts/test-merchant-i18n-ui.js
          node scripts/test-merchant-audit-ui.js
