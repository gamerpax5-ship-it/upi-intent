name: Pairing metadata isolated checks
on:
  push:
    branches: [wpay/pairing-metadata]
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-pairing
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org
      - run: node --test test/pairing-service-backend.test.js test/pairing-extended.test.js
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-pairing@127.0.0.1:5432/postgres
